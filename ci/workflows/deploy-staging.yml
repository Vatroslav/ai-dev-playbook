# Deploy to STAGING on every merge to main. Copy to .github/workflows/deploy-staging.yml.
#
# Generic container-platform skeleton. Steps named "PROVIDER-SPECIFIC" fail on purpose until you
# fill them in for your platform (Cloud Run, Fly.io, AWS, Azure, ...). Everything else is neutral.
# Production is NOT deployed from GitHub at all: a human runs the prod deploy script
# (see docs/agent/ci-cd-and-deploy.md). No workflow may mention prod resources or secrets.
#
# Contract this workflow expects from the app (adapt paths and field names, keep the checks):
#   GET  /api/health     -> 200 {"status":"ok","version":"X.Y.Z","commit":"<full sha>","errorReporting":"on"}
#                           public, no auth, does NOT touch the database
#   GET  /api/health/deep  -> 200 {"status":"ok","schema":{"latest":"<migration name>","count":N}}
#                           needs header X-Probe-Key, connects to the DB as the app role
#   POST /api/webhooks/<provider> without a valid signature -> 401 (503 = signing secret not mounted)
#
# Repository config (Settings -> Secrets and variables -> Actions, environment "staging"):
#   vars.STAGING_IMAGE         registry path without tag, e.g. <registry>/<project>/app
#   vars.STAGING_URL           e.g. https://staging.example.com
#   secrets.STAGING_PROBE_KEY

name: Deploy staging

on:
  push:
    branches: [main]
    # Blacklist of paths that cannot change the running app. Never list scripts/, .github/ or
    # anything the Dockerfile COPYs, or a merged change silently never deploys.
    # Accepted side effect: the staging SHA lags main after docs-only merges.
    paths-ignore: ["docs/**", ".claude/**", "**/*.md"]
  workflow_dispatch:

# Queue, never cancel: a deploy cancelled half-way leaves half-applied state, and parallel
# deploys collide.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

# The ONLY workflow with id-token: write (keyless OIDC). ci.yml runs on PR code and must never have it.
permissions:
  contents: read
  id-token: write

env:
  IMAGE: ${{ vars.STAGING_IMAGE }}
  STAGING_URL: ${{ vars.STAGING_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@PIN_TO_FULL_COMMIT_SHA # vX.Y.Z
        with:
          persist-credentials: false

      # Fail early and loudly on missing config instead of deploying half-configured.
      - name: Preflight
        env:
          PROBE_KEY: ${{ secrets.STAGING_PROBE_KEY }}
        run: |
          missing=""
          [ -n "$IMAGE" ] || missing="$missing vars.STAGING_IMAGE"
          [ -n "$STAGING_URL" ] || missing="$missing vars.STAGING_URL"
          [ -n "$PROBE_KEY" ] || missing="$missing secrets.STAGING_PROBE_KEY"
          [ -z "$missing" ] || { echo "::error::Missing repository config:$missing"; exit 1; }

      # Repeat security-boundary guards here: a direct push to main bypasses PR checks.
      # Lint and tests stay out of this workflow: they are quality gates, not leak boundaries.
      # - name: Boundary guards
      #   run: node scripts/check-forbidden-refs.mjs

      # PROVIDER-SPECIFIC: keyless login via OIDC / workload identity federation, plus registry
      # login. No key file, no long-lived cloud token in secrets. The deployer identity may push
      # images and deploy STAGING resources only; it has zero rights over production.
      # Example (Google Cloud):
      #   - uses: google-github-actions/auth@PIN_TO_FULL_COMMIT_SHA # vX.Y.Z
      #     with:
      #       workload_identity_provider: ${{ vars.WIF_PROVIDER }}
      #       service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}
      #   - uses: google-github-actions/setup-gcloud@PIN_TO_FULL_COMMIT_SHA # vX.Y.Z
      #   - run: gcloud auth configure-docker <region>-docker.pkg.dev --quiet
      # Example (AWS):
      #   - uses: aws-actions/configure-aws-credentials@PIN_TO_FULL_COMMIT_SHA # vX.Y.Z
      #     with:
      #       role-to-assume: ${{ vars.DEPLOYER_ROLE_ARN }}
      #       aws-region: ${{ vars.AWS_REGION }}
      - name: "PROVIDER-SPECIFIC: authenticate (OIDC) and log in to the registry"
        run: |
          echo "::error::Fill in your platform's OIDC login here (see the comments above this step)."
          exit 1

      # Tag = commit SHA, never `latest`: the running revision names its code, prod later promotes
      # this exact image, and rollback means deploying an older tag.
      - name: Build and push image
        run: |
          set -euo pipefail
          docker build --build-arg APP_SHA="$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      # Migrations run BEFORE the app deploy, and only when the live schema lags the repo.
      # Compare the latest migration name AND the count: a merge can bring in a migration with an
      # older timestamp, which a name-only comparison misses.
      # The migration runs as a one-off job from the new image, with its own role/secret that
      # cannot reach the production database, and with retries off. A failure stops the deploy;
      # the old revision keeps running on the old schema. Production migrations stay a human action.
      - name: Migrate staging database (only if the live schema lags)
        env:
          PROBE_KEY: ${{ secrets.STAGING_PROBE_KEY }}
        run: |
          set -euo pipefail
          # Repo state. Prisma layout shown (one folder per migration + migration_lock.toml).
          REPO_LATEST="$(ls -1 prisma/migrations | grep -v '\.toml$' | sort | tail -n 1)"
          REPO_COUNT="$(ls -1 prisma/migrations | grep -vc '\.toml$' || true)"
          LIVE="$(curl -sS -m 20 -H "X-Probe-Key: $PROBE_KEY" "$STAGING_URL/api/health/deep" || true)"
          LIVE_LATEST="$(printf '%s' "$LIVE" | jq -r '.schema.latest // empty' 2>/dev/null || true)"
          LIVE_COUNT="$(printf '%s' "$LIVE" | jq -r '.schema.count // empty' 2>/dev/null || true)"
          echo "repo: $REPO_LATEST ($REPO_COUNT)   live: ${LIVE_LATEST:-unknown} (${LIVE_COUNT:-unknown})"
          if [ "$REPO_LATEST" = "$LIVE_LATEST" ] && [ "$REPO_COUNT" = "$LIVE_COUNT" ]; then
            # A skipped step must look different from a failed or a successful one.
            echo "Schema current: migration SKIPPED." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Schema lags the repo: running migrations." | tee -a "$GITHUB_STEP_SUMMARY"
          # PROVIDER-SPECIFIC: run the one-off migration job built from "$IMAGE:$GITHUB_SHA", e.g.
          #   gcloud run jobs deploy app-migrate-staging --image "$IMAGE:$GITHUB_SHA" --max-retries 0 ... \
          #     && gcloud run jobs execute app-migrate-staging --wait
          # On Fly.io, use `[deploy] release_command` in fly.toml instead of this step.
          # Never run migrations over SSH from CI.
          echo "::error::Fill in the migration command for your platform."
          exit 1

      # PROVIDER-SPECIFIC: deploy "$IMAGE:$GITHUB_SHA" to the staging service. Rules for any platform:
      #   - Env-var and secret flags often OVERWRITE the whole set (Cloud Run --set-env-vars /
      #     --set-secrets do): list every entry on every deploy.
      #   - Mount secrets unconditionally. A missing secret must fail the deploy, not start a
      #     service that silently runs without login or error reporting.
      #   - Don't add flags the deployer identity has no permission to apply: they only print a
      #     warning, and read like a guarantee that does not exist.
      #   - Don't branch on a check the deployer cannot perform ("mount the secret only if I can
      #     read it"): it always takes the else path.
      #   - Pass APP_ENV=staging and APP_SHA=$GITHUB_SHA. Give staging the same runtime flags as prod.
      # Example (Cloud Run):
      #   gcloud run deploy app-staging --region "<region>" --image "$IMAGE:$GITHUB_SHA" \
      #     --set-env-vars "APP_ENV=staging,APP_SHA=$GITHUB_SHA" \
      #     --set-secrets "DATABASE_URL=db-url-staging:latest,PROBE_KEY=probe-key-staging:latest,ERROR_DSN=error-dsn-staging:latest" \
      #     --quiet
      - name: "PROVIDER-SPECIFIC: deploy"
        run: |
          echo "::error::Fill in the deploy command for your platform (see the comments above this step)."
          exit 1

      # Post-deploy smoke test. Prints every response body: `curl -f` would hide the diagnosis.
      - name: Smoke test
        env:
          PROBE_KEY: ${{ secrets.STAGING_PROBE_KEY }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/body.json"
          probe() {   # probe <path> [curl args...]: prints the body, fails unless HTTP 200
            local path="$1"; shift
            local code
            code="$(curl -sS -m 20 -o "$BODY" -w '%{http_code}' "$@" "$STAGING_URL$path" || true)"
            echo "--- $path -> ${code:-000}"; cat "$BODY" 2>/dev/null || true; echo
            [ "$code" = "200" ] || { echo "::error::$path returned ${code:-000}"; return 1; }
          }

          # 1. Liveness WITHOUT an auth header: proves public traffic reaches the app.
          probe /api/health
          LIVE_SHA="$(jq -r '.commit // empty' "$BODY" || true)"
          LIVE_VERSION="$(jq -r '.version // empty' "$BODY" || true)"
          [ "$LIVE_SHA" = "$GITHUB_SHA" ] || { echo "::error::live commit '$LIVE_SHA' is not $GITHUB_SHA"; exit 1; }

          # 2. Error reporting is armed. The app reports SDK state (client bound, DSN parsed),
          #    not env-var presence.
          ERR="$(jq -r '.errorReporting // empty' "$BODY" || true)"
          [ "$ERR" = "on" ] || { echo "::error::error reporting is '${ERR:-missing}', expected 'on'"; exit 1; }

          # 3. Deep health: DB connection under the app role, schema in step with this commit.
          probe /api/health/deep -H "X-Probe-Key: $PROBE_KEY"
          REPO_LATEST="$(ls -1 prisma/migrations | grep -v '\.toml$' | sort | tail -n 1)"
          REPO_COUNT="$(ls -1 prisma/migrations | grep -vc '\.toml$' || true)"
          [ "$(jq -r '.schema.latest // empty' "$BODY")" = "$REPO_LATEST" ] || { echo "::error::live schema latest != $REPO_LATEST"; exit 1; }
          [ "$(jq -r '.schema.count // empty' "$BODY")" = "$REPO_COUNT" ] || { echo "::error::live schema count != $REPO_COUNT"; exit 1; }

          # 4. Webhooks reject unsigned requests with 401. A 503 means the signing secret is not mounted.
          CODE="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$STAGING_URL/api/webhooks/example" || true)"
          [ "$CODE" = "401" ] || { echo "::error::unsigned webhook got ${CODE:-000}, expected 401"; exit 1; }

          echo "Deployed to staging: v$LIVE_VERSION (sha ${GITHUB_SHA::7}, confirmed on /api/health)" | tee -a "$GITHUB_STEP_SUMMARY"
